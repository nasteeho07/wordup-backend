name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wordup
          POSTGRES_USER: wordup
          POSTGRES_PASSWORD: wordup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wordup"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Java instellen
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Bouwen en testen
        run: ./mvnw -B verify