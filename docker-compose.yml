services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wordup
      POSTGRES_USER: wordup
      POSTGRES_PASSWORD: wordup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordup -d wordup"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wordup
      SPRING_DATASOURCE_USERNAME: wordup
      SPRING_DATASOURCE_PASSWORD: wordup
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: